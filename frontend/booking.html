    <main>
        <h1>Book a Room</h1>
        <p>Fill out the form to request a room. All fields are required.</p>

        <form id="booking-form">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" minlength="2" autocomplete="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@uh.edu" autocomplete="email" required>

            <label for="room">Room</label>
            <select id="room" name="room" required>
                <option value="">-- Choose a room --</option>
                <option value="Ballroom">Ballroom (up to 400 people)</option>
                <option value="Theater">Theater (up to 100 people)</option>
                <option value="Meeting Room A">Meeting Room A (up to 20 people)</option>
                <option value="Meeting Room B">Meeting Room B (up to 20 people)</option>
                <option value="Group Study Room">Group Study Room (up to 8 people)</option>
            </select>
            <p id="room-status" role="status"></p>

            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>

            <label for="start">Start Time</label>
            <input type="time" id="start" name="start" required>

            <label for="end">End Time</label>
            <input type="time" id="end" name="end" required>

            <label for="people">Number of People</label>
            <input type="number" id="people" name="people" min="1" max="400" required>

            <button type="submit" class="button">Request Booking</button>
            <p id="message" role="status"></p>
        </form>
    </main>
